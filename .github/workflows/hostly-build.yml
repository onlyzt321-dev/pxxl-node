name: Build and push to Hostly Registry

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.hostly.ninja
          username: ${{ secrets.HOSTLY_REGISTRY_USERNAME }}
          password: ${{ secrets.HOSTLY_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.hostly.ninja/tianzhou/pxxl-node:latest
