name: Build and push to Hostly Registry

on:
  workflow_dispatch:
    inputs:
      hostly_code:
        description: 'Hostly registry login code (valid 5 min)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.hostly.ninja
          username: onlyzt321@gmail.com
          password: ${{ inputs.hostly_code }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.hostly.ninja/tianzhou/pxxl-node:latest
